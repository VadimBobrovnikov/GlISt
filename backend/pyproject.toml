[project]
name = "glist"
version = "0.1.0"
description = "GlISt — мультиагентная платформа геопространственного анализа"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2",
    "langfuse>=2.50",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "pystac-client>=0.8",
    "arq>=0.26",
    "redis>=5.0",
    "reportlab>=4.2",
    "matplotlib>=3.9",
    # Не в явном списке задачи T002, но обязательно по plan.md/T007/T008:
    # async-движок SQLAlchemy для Alembic (async engine) и асинхронных сессий БД.
    "asyncpg>=0.29",
    # Python-binding для pgvector: модели эмбеддингов (data-model.md, RAG).
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    # Только приёмочный контур SC-002 (acceptance harness), не в рантайме анализа.
    "scikit-learn>=1.5",
]

[tool.uv]
# Приложение, а не публикуемая библиотека: src-импорты обеспечиваются pythonpath ниже.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["src"]
exclude = ["\\.venv"]
# Плагин pydantic: корректный __init__ для BaseSettings/BaseModel (иначе dataclass_transform
# требует обязательные поля как аргументы, хотя pydantic-settings берёт их из окружения).
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Библиотеки без полных py.typed-аннотаций: strict-проверка применяется к нашему коду.
module = [
    "rasterio.*",
    "geopandas.*",
    "shapely.*",
    "reportlab.*",
    "arq.*",
    "pystac_client.*",
    "langfuse.*",
    "langgraph.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/glist"]

[tool.coverage.report]
omit = ["*/agents/*"]
fail_under = 80
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
