# GlISt — конфигурация Alembic (T007).
# URL БД в ini НЕ хранится: sqlalchemy.url задаёт env.py из переменной
# DATABASE_URL (окружение или backend/.env) — секреты вне репозитория (Принцип IX).

[alembic]
# Расположение скриптов миграций относительно этого ini-файла.
script_location = %(here)s/alembic

# Путь к пакету glist добавляет сам env.py (от своего расположения, не от cwd),
# поэтому prepend_sys_path здесь не используется.

# Шаблон имён файлов миграций: 0001_initial_schema.py (см. T018).
file_template = %%(rev)s_%%(slug)s

# Разделитель списков в ini-файлах (os.pathsep).
path_separator = os

# Логгинг: конфигурация ниже потребляется env.py через fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
